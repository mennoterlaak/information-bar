name: InformationBarMobile
options:
  bundleIdPrefix: dev.starecat.InformationBar.mobile
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: K8MRZPASGA
    APP_GROUP: group.dev.starecat.InformationBar.mobile
    KEYCHAIN_GROUP: dev.starecat.InformationBar.mobile.shared
    GENERATE_INFOPLIST_FILE: YES
    TARGETED_DEVICE_FAMILY: '1,2'
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: YES
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  InformationBarMobile:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - Assets.xcassets
      - Configuration/PrivacyInfo.xcprivacy
      - ../Sources/InformationBar/Models.swift
      - ../Sources/InformationBar/Preferences.swift
      - ../Sources/InformationBar/EnergyModels.swift
      - ../Sources/InformationBar/KrakenModels.swift
      - ../Sources/InformationBar/DemoData.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.starecat.InformationBar.mobile
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Information Bar
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    info:
      path: Configuration/App-Info.plist
      properties:
        AppGroupIdentifier: $(APP_GROUP)
        SharedKeychainGroup: $(AppIdentifierPrefix)$(KEYCHAIN_GROUP)
        LSApplicationCategoryType: public.app-category.utilities
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: Information Bar securely syncs your dashboard from your Mac on the same network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: dev.starecat.InformationBar.mobile
            CFBundleURLSchemes: [informationbar]
    entitlements:
      path: Configuration/App.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP)]
        keychain-access-groups: [$(AppIdentifierPrefix)$(KEYCHAIN_GROUP)]
    dependencies:
      - target: InformationBarWidgets
        embed: true
  InformationBarWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
      - Assets.xcassets
      - Configuration/PrivacyInfo.xcprivacy
      - ../Sources/InformationBar/Models.swift
      - ../Sources/InformationBar/Preferences.swift
      - ../Sources/InformationBar/EnergyModels.swift
      - ../Sources/InformationBar/KrakenModels.swift
      - ../Sources/InformationBar/DemoData.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.starecat.InformationBar.mobile.widgets
        INFOPLIST_KEY_CFBundleDisplayName: Information Bar
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Configuration/Widget-Info.plist
      properties:
        AppGroupIdentifier: $(APP_GROUP)
        SharedKeychainGroup: $(AppIdentifierPrefix)$(KEYCHAIN_GROUP)
        NSLocalNetworkUsageDescription: Information Bar securely updates your widgets from your Mac on the same network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Configuration/Widget.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP)]
        keychain-access-groups: [$(AppIdentifierPrefix)$(KEYCHAIN_GROUP)]
  InformationBarMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.starecat.InformationBar.mobile.tests
    dependencies:
      - target: InformationBarMobile
schemes:
  InformationBarMobile:
    build:
      targets:
        InformationBarMobile: all
        InformationBarMobileTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - InformationBarMobileTests
    archive:
      config: Release
